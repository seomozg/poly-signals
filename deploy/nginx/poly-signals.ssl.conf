# poly-signals.ru — Next.js в Docker (127.0.0.1:3010) на хосте Timeweb (VestaCP).
# ФАЗА 2: применять только после certbot certonly --webroot (см. poly-signals.conf).
#
# Деплой: скопировать в /etc/nginx/conf.d/poly-signals.conf && nginx -t && systemctl reload nginx

server {
    listen 89.223.122.221:80;
    server_name poly-signals.ru;

    location /.well-known/acme-challenge/ {
        root /var/lib/poly-signals-acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 89.223.122.221:443 ssl;
    server_name poly-signals.ru;

    ssl_certificate     /etc/letsencrypt/live/poly-signals.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poly-signals.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    access_log /var/log/nginx/poly-signals-access.log;
    error_log  /var/log/nginx/poly-signals-error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Статика /images — напрямую из docker volume (каталог полон www-data'ем)
    location /images/ {
        alias /var/lib/docker/volumes/poly-signals_images-data/_data/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Next.js static assets — immutable, кэш на 1 год (хэш в имени файла)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSR + все роуты /api и /sitemap.xml — единый сервис next
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
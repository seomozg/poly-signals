# Конфиг системного Nginx для хоста Timeweb (89.223.122.221, Ubuntu 18.04 + VestaCP).
# Деплой: скопировать в /etc/nginx/conf.d/poly-signals.conf && nginx -t && systemctl reload nginx
#
# Фаза 1 (этот файл, до выпуска сертификата): только ACME-webroot + redirect на https.
# Фаза 2 — poly-signals.ssl.conf (443 + proxy), после certbot certonly --webroot.
#
# Ловушки этого хоста (см. также шаблон padel-russia.conf):
#   - listen ТОЛЬКО на IP хоста — wildcard-listen конфликтует с default-виртуалом Vesta
#     и может уронить чужие сайты;
#   - server_name БЕЗ IP, чтобы IP-трафик шёл в дефолтный vhost Vesta, а не к нам;
#   - proxy на 127.0.0.1:3010 — порт 3000 занят соседним next-server, 3100/3101 — padel-russia.

server {
    listen 89.223.122.221:80;
    server_name poly-signals.ru;

    # ACME HTTP-01: certbot certonly --webroot -w /var/lib/poly-signals-acme -d poly-signals.ru
    location /.well-known/acme-challenge/ {
        root /var/lib/poly-signals-acme;
    }

    location / {
        return 301 https://poly-signals.ru$request_uri;
    }
}
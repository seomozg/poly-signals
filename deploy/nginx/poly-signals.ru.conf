# poly-signals.ru — Next.js приложение в Docker (127.0.0.1:3010).
#
# ВАЖНО: systemd-юнит nginx на этом хосте в состоянии failed, рабочий мастер
# запущен отдельно. Никаких `systemctl restart/reload nginx` — только
#   nginx -t && kill -HUP <pid мастер-процесса>
# Сертификат Let's Encrypt выпускается/обновляется certbot в режиме webroot
# (челлендж лежит в /var/www/letsencrypt-webroot, локация сохранена ниже).

server {
    listen 80;
    server_name poly-signals.ru www.poly-signals.ru;

    access_log /var/log/nginx/poly-signals-access.log;
    error_log  /var/log/nginx/poly-signals-error.log;

    # ACME challenge — renewal must keep working
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-webroot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name poly-signals.ru www.poly-signals.ru;

    # SSL certificate from Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/poly-signals.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poly-signals.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    access_log /var/log/nginx/poly-signals-access.log;
    error_log  /var/log/nginx/poly-signals-error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
